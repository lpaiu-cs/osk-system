# 검증한 정식 릴리스 커밋을 태그와 GitHub Release로 공개한다.
#
# 이 워크플로는 **권위를 만들지 않는다**. 증빙은 정본에서의 릴리스 선언과
# `release.json`이 이미 끝냈고(시행령 §10 6항), 여기서는 그 사실을 옮겨 적을
# 뿐이다. 로컬 osk.release로 만든 비준증빙 커밋을 브랜치로만 먼저 보낸다.
# updater는 git 태그를 읽으므로, 회귀 수트와 전체 업그레이드 행렬이 통과하기
# 전에는 원격 태그도 만들지 않는다. 실행 시작의 SHA가 검증·공개의 같은 대상이다.
#
# 발행 매니페스트에 `.github/`가 없으므로 이 파일은 릴리스 payload에 들어가지
# 않는다. 인스턴스는 받지 않는다 — 정본의 발행 설비이지 프레임워크가 아니다.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "정식 릴리스 버전 (vX.Y.Z)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      upgrade-matrix: full
      release-candidate: ${{ inputs.version }}=${{ github.sha }}
    permissions:
      contents: read

  mirror:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Release 생성. 그 외 권한은 주지 않는다.
    steps:
      - name: 비준증빙을 확인하고 Release를 만든다
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::정식 버전은 vX.Y.Z여야 한다."
            exit 1
          fi

          # 이미 있으면 손대지 않는다 — 손으로 쓴 노트를 덮지 않기 위해서다.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG 는 이미 Release가 있다 — 그대로 둔다."
            exit 0
          fi

          # 브랜치가 움직여도 검증한 커밋의 증빙만 읽는다. 태그는 아직 공개하지 않았다.
          if ! gh api "repos/$REPO/contents/release.json?ref=$COMMIT" --jq '.content' \
               | base64 -d > release.json; then
            echo "::error::$COMMIT 에 release.json이 없다 — 정식 릴리스 커밋이 아니다."
            exit 1
          fi

          # 실패 뒤 재시도는 같은 태그 커밋에만 허용한다. 다른 커밋을 덮지 않는다.
          existing=$(gh api "repos/$REPO/git/matching-refs/tags/$TAG" \
                       --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .object.sha")
          if [ -n "$existing" ] && [ "$existing" != "$COMMIT" ]; then
            echo "::error::$TAG 는 검증한 커밋과 다르다."
            exit 1
          fi

          ver=$(python3 -c 'import json;print(json.load(open("release.json"))["version"])')
          num=$(python3 -c 'import json;print(len(json.load(open("release.json"))["files"]))')

          if [ "$ver" != "$TAG" ]; then
            echo "::error::증빙의 버전($ver)이 태그($TAG)와 다르다 — 만들지 않는다."
            exit 1
          fi

          notes=$(gh api -X POST "repos/$REPO/releases/generate-notes" \
                    -f tag_name="$TAG" -f target_commitish="$COMMIT" --jq '.body')

          {
            printf '비준증빙 `release.json` — 파일 %s건의 내용 해시로 이 판본을 고정한다.\n' "$num"
            printf '인스턴스는 증빙과 전수 대조한 것만 적용한다.\n\n'
            printf '첫 적용 요청은 변경집합과 하네스 재시작 필요성을 보여주고 멈춘다. 사용자 명시 재승인 뒤에만 같은 명령을 다시 실행한다.\n\n'
            printf 'v3.20.x에서 처음 전환할 때는 새 릴리스 체크아웃의 엔진을 PYTHONPATH로, 실제 인스턴스를 OSK_VAULT_ROOT로 지정한다. 자세한 절차는 SETUP을 따른다.\n\n'
            printf '```bash\n'
            printf 'PYTHONPATH=_governance/_engine .venv/bin/python -m osk.update --apply --to %s\n' "$TAG"
            printf '```\n\n'
            printf '설치·운용은 [docs/SETUP.md](../blob/%s/docs/SETUP.md)에 있다.\n\n' "$TAG"
            printf -- '---\n\n%s\n' "$notes"
          } > notes.md

          # --target의 정확한 SHA로 태그를 만들면서 정식 Release를 공개한다.
          gh release create "$TAG" --repo "$REPO" --target "$COMMIT" --title "$TAG" --notes-file notes.md
